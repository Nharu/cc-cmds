name: gate

# The gate suite, cut into shards that run at once. It lives in its own
# workflow rather than as another job in `lint` because its path filter is
# narrower: the lint leg has to run on skill and README edits that cannot
# possibly move a gate section, and pulling the suite along with them (about
# 280 shard-minutes) is what this split removes.
#
# A PULL REQUEST RUNS ONLY THE SECTIONS ITS CHANGE CAN REACH; MASTER RUNS THEM
# ALL ON A SCHEDULE. `gate-plan` hands the merge commit's two parents to
# `scripts/gate-select.sh`, which answers either the whole suite with a reason
# or a closed list of sections, and the table is cut from that list alone: K
# regular rows, K being the selected sections' share of the estimated time
# times GATE_SHARDS, rounded up and kept within 1..GATE_SHARDS. A selector that
# cannot decide is read as the whole suite. A pull request that selects no
# section opens no shard at all. Master is no longer run on push: a schedule
# every four hours, and `workflow_dispatch` by hand, run the whole suite when
# `scripts/gate-full.sh due` says master moved since the last whole run, and
# only those runs upload the timing and duration windows the next runs read.
#
# THE PARTITION IS WEIGHED WITH WHAT THE LAST THREE MASTER RUNS MEASURED. Every
# shard writes a marker line in front of each section it runs, `gate-report`
# turns those into per-section times, and a whole master run uploads them as the
# `gate-timing` artifact. The next run's `gate-plan` job downloads that artifact
# from the newest three master runs that still have it, takes each
# section's median over them (one run's noise no longer moves the partition by
# itself), makes the partition table from it once, and every shard and the
# coverage check read that one table — no job partitions on its own, so no two
# jobs can see different inputs. A section none of them measured is weighed by
# its length in suite lines, or the median of the measured sections when that
# is larger. With no artifact every section is weighed by its length in lines,
# with a warning; no person has to regenerate anything for the weights to stay
# current.
#
# EACH RUNNER RUNS L ROWS AT ONCE. The partition has S = N × L rows (the
# Makefile's GATE_SLOTS, with N and L from GATE_SHARDS and GATE_LANES); the
# matrix has N runners, and runner k runs rows k, k + N, … side by side, each
# lane with its own temporary directory, marker file and result file. L is 1
# now, so every runner runs one row: two rows on one runner stretched each
# section's time by about a fifth. One row per runner removes that stretch, but
# not the floor the heaviest sections that cannot be split set on the slowest
# row, which still keeps the wall clock near fifteen minutes.
# A lane is judged on its own exit code and total line, and `gate-report`
# checks that every non-empty row of the table printed its total.
#
# THE TEST TIME IS A SIGNAL OF ITS OWN, ON A WHOLE RUN ONLY. A narrowed run's
# sum is not comparable with the master window, so it is not judged; a pull
# request the selector reads as the whole suite is. `gate-report` sums the row times and
# hands them to `scripts/ci-duration.sh`, together with the plan directory and
# this run's merged section times. A pull request whose sum, less its budget
# raise, stays under the common upper bound — the master window's median plus
# the tolerance, or its largest value plus tol_s, whichever is larger — passes.
# Past it, the sections the pull request did not change measure the runner:
# their time in this run over their master median is a factor, floored at 1,
# that the baseline is scaled by. Still past the scaled bound fails, as growth
# the pull request added; inside it warns, naming the factor and that the
# cause is the runner environment or a shared path this pull request slowed;
# without usable plan inputs it warns with the reason. The absolute level over
# budget always only warns.
# How even the shards actually were is in the report job's summary, with a
# warning past a max/median of 1.5.
#
# A CHANGED SECTION IS RUN IN MORE THAN ONE CONTEXT. `gate-plan` compares each
# section's text with the base's (`test-gate.sh --digests`) and hands the ones
# that differ to `gate-shard.sh --isolate`, which lays two solo runs of each,
# and the section laid over other rows, into the room the regular rows leave;
# what does not fit goes onto extra rows S+1..S+E, at most GATE_ISO_EXTRA of
# them. The matrix is the plan job's row list, so it grows by E. Every row that
# ran isolation work uploads `iso-<row>`, and `gate-isolation` compares the
# contexts of every changed section: a section that behaves differently in one
# of them leans on state it does not declare, and the run fails. Isolation
# time stays out of the duration signal. Without a base to compare with, or
# without measured times to place by, a change to a section fails here rather
# than going unchecked.
#
# THE FILTER NAMES THIS FILE. Without that line the workflow is absent from the
# pull request that introduces it, so its check names never render and there is
# no green run to harvest them from — the branch protection would then be
# pointed at contexts that do not exist, which requires nothing at all.
#
# THE RUNNER IMAGE IS NAMED, NOT `ubuntu-latest`. When `ubuntu-latest` moved
# to Ubuntu 26.04, whose default coreutils are the Rust rewrite, dispatch paths
# started dying with rc 1 and `tr: write error: Broken pipe` at random, in
# different sections on every run, on master too. The suite was written and
# timed against GNU coreutils on 24.04, so every job names that image. Moving
# to a newer one is a change of its own, with the suite made to pass there.
on:
  pull_request:
    paths:
      - 'scripts/test-gate.sh'
      - 'scripts/gate-select.sh'
      - 'scripts/gate-full.sh'
      - 'scripts/gate-shard.sh'
      - 'scripts/gate-timing.sh'
      - 'scripts/gate-timing.tsv'
      - 'scripts/gate-isolation.sh'
      - 'scripts/ci-duration.sh'
      - 'scripts/ci-duration-budget.tsv'
      - 'plugins/cc-cmds/orchestrator/**'
      - 'Makefile'
      - '.github/workflows/gate.yml'
  # Every four hours, off the hour. A round whose master did not move since the
  # last whole run ends in `gate-plan` with nothing run.
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

# Pull request runs never wait on each other; whole master runs queue behind
# one another instead of being cancelled, since a cancelled one measured
# nothing. A `workflow_dispatch` on another ref queues in a group of its own,
# so a branch's trial run never pushes master's waiting round out.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gate-pr-{0}', github.run_id) || github.ref == 'refs/heads/master' && 'gate-full' || format('gate-full-{0}', github.ref) }}
  cancel-in-progress: false

# Naming one permission sets every unnamed one to `none`, so both are written:
# `contents` for the checkout and `actions` to read other runs' artifacts.
permissions:
  contents: read
  actions: read

jobs:
  # The one place the partition is made. The source is said in the summary —
  # `artifact <run id> ...` (every run the median was taken over, newest
  # first) or `lines` — with the age of the newest run and the
  # sections none of them measured, which are weighed by their length or at
  # the median of the measured ones, whichever is larger; `table.err` in the
  # `gate-plan` artifact has one line per such section with its estimate.
  # Only master runs of this repository are read, so an artifact of the
  # same name uploaded by a fork's pull request never becomes the source.
  #
  # Its outputs drive the rest: `run` says whether anything runs at all (a
  # scheduled round on an unmoved master says 0; a pull request does not
  # decide, and its empty `run` reads as the whole suite, as does the empty
  # `run` of a plan that failed before deciding — every condition is written
  # `!= '0'`), `mode` is `전량` or `선택` (a run that did not select is
  # `전량`), `selected` the closed section list of a narrowed run and `count`
  # how many sections run. `rows` is the matrix (runners 1..R/L, then the extra rows
  # R+1..R+E), `regular` is R — the regular rows the table actually has, which a
  # narrowed table may hold fewer of than K — `runners` and `lanes` what the
  # shard target needs to agree with it, `extra` is E and `work` is how many
  # rows carry isolation work, which `gate-isolation` must get back.
  gate-plan:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      run: ${{ steps.due.outputs.run || '1' }}
      mode: ${{ steps.select.outputs.mode || '전량' }}
      selected: ${{ steps.select.outputs.selected }}
      count: ${{ steps.select.outputs.count }}
      rows: ${{ steps.table.outputs.rows }}
      regular: ${{ steps.table.outputs.regular }}
      runners: ${{ steps.table.outputs.runners }}
      lanes: ${{ steps.table.outputs.lanes }}
      extra: ${{ steps.table.outputs.extra }}
      work: ${{ steps.table.outputs.work }}
    steps:
      # A pull request checks out one merge commit whose first parent is the
      # base tip, so two commits are enough; a whole run compares two shas and
      # reads nothing older.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      # A scheduled round runs when master moved since the last whole run; a
      # round that cannot tell runs too. A pull request does not ask: the step
      # is skipped and the empty `run` reads as a run.
      #
      # THE STEP CONDITIONS BELOW WRAP `run` IN `format`. A skipped step's
      # output is null, not an empty string, and an expression comparing null
      # with '0' turns both into the number 0, so `!= '0'` alone is false on a
      # pull request and every later step is skipped while the run is green.
      # `format` makes it the string '' first. A job output whose value is
      # empty is not set at all and reads as null in the same way, so the job
      # output `run` above falls back to '1' when the step did not run.
      - name: Is a run due
        id: due
        if: github.event_name != 'pull_request'
        run: bash scripts/gate-full.sh due >> "$GITHUB_OUTPUT"

      - uses: mikefarah/yq@v4
        if: format('{0}', steps.due.outputs.run) != '0'

      # FAILING IS THE POINT WHEN THERE IS NO BASE. Reading "no base" as "no
      # changed section" would leave the isolation check empty without a word,
      # so a pull request whose base file the selector cannot read (its bounds,
      # or a stray row inside them) fails the run instead. A whole master run
      # has no base to compare with and changes no section: it writes an empty
      # list and `-` for the base.
      - name: Find the changed sections
        if: format('{0}', steps.due.outputs.run) != '0'
        run: |
          plan="$RUNNER_TEMP/plan"; mkdir -p "$plan"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            : > "$plan/changed"
            echo "-" > "$plan/base"
            echo "바뀐 절: (전량 실행 — 베이스 비교 없음)"
            exit 0
          fi
          base=$(git rev-parse --verify -q 'HEAD^1') || base=""
          if [ -z "$base" ] \
             || ! git show "$base:scripts/test-gate.sh" > "$RUNNER_TEMP/base-test-gate.sh" \
             || ! make -s --no-print-directory print-gate-digests GATE_DIGESTS_FROM="$RUNNER_TEMP/base-test-gate.sh" > "$plan/base.dig" \
             || ! make -s --no-print-directory print-gate-digests > "$plan/head.dig"; then
            echo "::error::격리 검사 불가 — 베이스 없음 (베이스 '${base:-없음}' 의 scripts/test-gate.sh 다이제스트를 내지 못했습니다)"
            exit 1
          fi
          awk -F '\t' 'FNR == NR { b[$1] = $2; next } !($1 in b) || b[$1] != $2 { printf "%s%s", (n++ ? "," : ""), $1 }' \
            "$plan/base.dig" "$plan/head.dig" > "$plan/changed"
          echo "$base" > "$plan/base"
          echo "바뀐 절: $(cat "$plan/changed")"

      # THE SELECTOR'S DOUBT IS THE WHOLE SUITE. Any exit other than 0, or an
      # answer that is neither form, runs everything, so a selector that breaks
      # can only make a run slower, never let a section go unrun. So does a
      # list missing a section the digest comparison above found changed (the
      # two are computed apart, and a changed section must never drop out of
      # its run and its isolation check), and a list while GATE_LANES is not 1
      # (the slot count then differs from the regular rows a narrowed table
      # has). The repository variable GATE_SELECT set to `off` skips the
      # selector altogether: the way to send every pull request back to the
      # whole suite without changing this file. Only a pull request selects; a
      # whole master run skips this step and is `전량`.
      - name: Select the sections
        id: select
        if: format('{0}', steps.due.outputs.run) != '0' && github.event_name == 'pull_request'
        env:
          GATE_SELECT: ${{ vars.GATE_SELECT }}
        run: |
          plan="$RUNNER_TEMP/plan"
          make -s print-gate-sections > "$plan/all-sections"
          mode="전량"; reason=""; sel=""
          if [ "$GATE_SELECT" = "off" ]; then
            reason="GATE_SELECT=off"
          else
            rc=0
            bash scripts/gate-select.sh --base 'HEAD^1' --head HEAD > "$plan/select.out" 2> "$plan/select.err" || rc=$?
            cat "$plan/select.err" >&2
            kind=$(cut -f 1 "$plan/select.out" | head -n 1)
            if [ "$rc" != "0" ]; then
              reason="선택 스크립트가 판정하지 못했습니다 (종료 $rc)"
            elif [ "$kind" = "절" ]; then
              mode="선택"; sel=$(cut -f 2 "$plan/select.out" | head -n 1)
            elif [ "$kind" = "전량" ]; then
              reason=$(cut -f 2- "$plan/select.out" | head -n 1)
            else
              reason="선택 스크립트의 답을 읽지 못했습니다"
            fi
          fi
          if [ "$mode" = "선택" ]; then
            missing=$(tr ',' '\n' < "$plan/changed" | grep . | awk -v S="$sel" 'BEGIN { n = split(S, a, ","); for (i = 1; i <= n; i++) w[a[i]] = 1 } !($0 in w) { printf "%s%s", (k++ ? "," : ""), $0 }')
            if [ -n "$missing" ]; then
              mode="전량"; sel=""; reason="바뀐 절 $missing 이 선택에 없습니다"
            elif [ "$(make -s print-gate-lanes)" != "1" ]; then
              mode="전량"; sel=""; reason="GATE_LANES 가 1 이 아닙니다"
            fi
          fi
          if [ "$mode" = "전량" ]; then
            count=$(grep -c . "$plan/all-sections" || true)
            echo "gate-plan: 판정 전량 — $reason"
          else
            count=$(printf '%s' "$sel" | tr ',' '\n' | grep -c . || true)
            echo "gate-plan: 판정 선택 ${count}절"
          fi
          echo "$mode" > "$plan/mode"
          echo "$reason" > "$plan/reason"
          echo "$sel" > "$plan/selected"
          {
            echo "mode=$mode"
            echo "selected=$sel"
            echo "count=${count:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Find the timing source
        if: format('{0}', steps.due.outputs.run) != '0'
        run: |
          plan="$RUNNER_TEMP/plan"; mkdir -p "$plan" "$RUNNER_TEMP/src"
          # One `<run id> <created_at>` line per run, newest first; the median
          # takes the files in that order.
          set --; runs=""; created=""
          if got=$(bash scripts/ci-duration.sh fetch-base --name gate-timing --workflow gate.yml --count 3 --out "$RUNNER_TEMP/src"); then
            while read -r id c; do
              [ -n "$id" ] || continue
              [ -n "$created" ] || created="$c"
              [ -f "$RUNNER_TEMP/src/$id/gate-timing.tsv" ] || continue
              set -- "$@" "$RUNNER_TEMP/src/$id/gate-timing.tsv"
              runs="$runs $id"
            done < <(printf '%s\n' "$got")
          fi
          if [ "$#" -ge 1 ] && bash scripts/gate-timing.sh median --out "$plan/gate-timing.tsv" "$@"; then
            echo "artifact$runs" > "$plan/source"
          else
            echo "::warning::gate-timing 아티팩트를 가진 schedule·workflow_dispatch 또는 master push 실행을 찾지 못해 절 본문 길이(줄 수)로 분할합니다"
            echo "lines" > "$plan/source"
            created=""
          fi
          echo "gate-plan: 타이밍 원천 $(cat "$plan/source")"
          age="-"
          if [ -n "$created" ]; then
            age=$(jq -rn --arg c "$created" '((now - ($c | fromdateiso8601)) / 3600 | floor | tostring) + "시간"' 2>/dev/null) || age="-"
          fi
          echo "$age" > "$plan/age"

      # Isolation is placed only with measured times. Weights in lines carry no
      # `@head` row and are not CI row seconds, so F and the room they give are
      # not the wall clock's unit; a change to a section then fails with that
      # reason rather than being placed by a guess.
      #
      # A NARROWED TABLE HAS K REGULAR ROWS, ONE LANE EACH. K is the selected
      # sections' estimated time over the whole suite's, times GATE_SHARDS,
      # rounded up and kept within 1..GATE_SHARDS; without measured weights it
      # is GATE_SHARDS. The table may hold fewer rows than K (never more rows
      # than components), so R — what every later job counts by — is read off
      # the table: its rows less the extra rows its placement line reports. No
      # selected section writes an empty table and an empty matrix, and no
      # shard job starts.
      - name: Make the partition table
        id: table
        if: format('{0}', steps.due.outputs.run) != '0'
        run: |
          plan="$RUNNER_TEMP/plan"
          changed=$(cat "$plan/changed")
          if [ ! -f "$plan/mode" ]; then
            echo "전량" > "$plan/mode"; : > "$plan/selected"
            echo "정기 전량 실행 (이벤트 $GITHUB_EVENT_NAME)" > "$plan/reason"
            echo "gate-plan: 판정 전량 — $(cat "$plan/reason")"
          fi
          mode=$(cat "$plan/mode"); sel=$(cat "$plan/selected")
          n=$(make -s print-gate-shards); lanes=$(make -s print-gate-lanes); s=$(make -s print-gate-slots)
          share="-"
          if [ "$mode" = "선택" ] && [ -z "$sel" ]; then
            : > "$plan/table.tsv"; : > "$plan/table.err"
            echo "0" > "$plan/extra"; echo "0" > "$plan/regular"; echo "0" > "$plan/runners"; echo "1" > "$plan/lanes"
            {
              echo "rows=[]"
              echo "regular=0"
              echo "runners=0"
              echo "lanes=1"
              echo "extra=0"
              echo "work=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### gate 분할 계획"
              echo ""
              echo "- 판정: 선택 0절 — 이 변경이 닿는 gate 절이 없어 샤드를 띄우지 않습니다"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f "$plan/gate-timing.tsv" ]; then set -- --timing "$plan/gate-timing.tsv"; else set --; fi
          shards="$s"
          if [ "$mode" = "선택" ]; then
            k="$n"
            if [ -f "$plan/gate-timing.tsv" ] \
               && bash scripts/gate-shard.sh --timing "$plan/gate-timing.tsv" --weights > "$plan/weights.tsv" 2>> "$plan/weights.err"; then
              got=$(awk -F '\t' -v S="$sel" -v N="$n" '
                BEGIN { m = split(S, a, ","); for (i = 1; i <= m; i++) want[a[i]] = 1 }
                { t += $2; if ($1 in want) w += $2 }
                END {
                  if (t <= 0) { print N " -"; exit }
                  x = w * N / t; k = int(x); if (k < x) k++
                  if (k < 1) k = 1; if (k > N) k = N
                  printf "%d %d%%\n", k, int(w * 100 / t + 0.5)
                }' "$plan/weights.tsv") && [ -n "$got" ] && { k=${got%% *}; share=${got#* }; }
            else
              echo "gate-plan: 절 추정 시간을 읽지 못해 행 수를 GATE_SHARDS 로 둡니다"
            fi
            shards="$k"; lanes=1
            set -- "$@" --only "$sel"
            echo "gate-plan: 좁힌 표 — 정규 행 상한 $k · 추정 시간 비율 $share"
          fi
          if [ -n "$changed" ]; then
            case "$(cat "$plan/source")" in
              artifact*) set -- "$@" --isolate "$changed" --iso-extra "$(make -s print-gate-iso-extra)" ;;
              *) echo "::error::격리 검사 불가 — 타이밍 원천 없음 (출처 $(cat "$plan/source"), 바뀐 절 $changed)"; exit 1 ;;
            esac
          fi
          rc=0
          bash scripts/gate-shard.sh --shards "$shards" "$@" --table \
            > "$plan/table.tsv" 2> "$plan/table.err" || rc=$?
          cat "$plan/table.err" >&2
          if [ "$rc" = "5" ]; then
            echo "::error::격리 검사 용량 초과 — 바뀐 절 $changed 의 단독 실행을 정규 행의 여유와 추가 행 $(make -s print-gate-iso-extra)개에 다 싣지 못했습니다"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::gate-shard.sh 도구 오류 (종료 $rc)"
            exit "$rc"
          fi
          e=$(sed -n 's/^gate-shard: 격리 배치 — .* · 추가 행 \([0-9][0-9]*\)\/.*/\1/p' "$plan/table.err" | head -n 1)
          e=${e:-0}
          r=$(( $(grep -c . "$plan/table.tsv") - e ))
          if [ "$mode" = "선택" ]; then runners="$r"; else runners="$n"; fi
          if [ "$r" -lt 1 ] || [ "$(( runners * lanes ))" != "$r" ]; then
            echo "::error::표의 정규 행 수 $r 가 러너 $runners 개 × 레인 $lanes 와 맞지 않습니다"
            exit 1
          fi
          rows=$( { seq 1 "$runners"; if [ "$e" -gt 0 ]; then seq $(( r + 1 )) $(( r + e )); fi; } | jq -sc .)
          work=$(awk -F '\t' '$4 != "" || $5 != "" || $6 != ""' "$plan/table.tsv" | grep -c . || true)
          echo "$e" > "$plan/extra"; echo "$r" > "$plan/regular"; echo "$runners" > "$plan/runners"; echo "$lanes" > "$plan/lanes"
          {
            echo "rows=$rows"
            echo "regular=$r"
            echo "runners=$runners"
            echo "lanes=$lanes"
            echo "extra=$e"
            echo "work=${work:-0}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### gate 분할 계획"
            echo ""
            if [ "$mode" = "선택" ]; then
              echo "- 판정: 선택 $(printf '%s' "$sel" | tr ',' '\n' | grep -c .)절 · 추정 시간 비율 $share · 정규 행 $r"
            else
              echo "- 판정: 전량 — $(cat "$plan/reason")"
            fi
            echo "- 출처: $(cat "$plan/source") · 나이: $(cat "$plan/age")"
            un=$(sed -n 's/^gate-shard: 실측 없는 절 /실측 없는 절 /p' "$plan/table.err")
            echo "- ${un:-실측 없는 절: 없음}"
            sed -n 's/^gate-shard: 예산 초과 덩어리 — /- 예산 초과 덩어리: /p' "$plan/table.err"
            echo "- 베이스 $(cat "$plan/base") 에서 바뀐 절: ${changed:-없음}"
            sed -n 's/^gate-shard: 격리 배치 — /- 격리 배치: /p; s/^gate-shard: 덮지 못한 쌍 — /- 덮지 못한 쌍: /p' "$plan/table.err"
            echo ""
            echo "| 행 | 예측 적재 | 절 수 | 단독 | 얹힘 |"
            echo "| --- | --- | --- | --- | --- |"
            awk -F '\t' '{ n = split($3, a, ","); print "| " $1 " | " $2 " | " (($3 == "") ? 0 : n) " | " (($5 == "") ? "-" : $5) " | " (($4 == "") ? "-" : $4) " |" }' "$plan/table.tsv"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: format('{0}', steps.due.outputs.run) != '0'
        with:
          name: gate-plan
          path: ${{ runner.temp }}/plan/

  # `fail-fast: false` because a red shard must not cancel the others. The
  # first thing anyone asks of a sharded failure is whether it is one section or
  # the whole suite, and a cancelled run cannot answer it. The marker and result
  # files are uploaded even from a red shard: the sections it finished were
  # measured, and the report job needs every row's result to say which row did
  # not print its total.
  #
  # The runner and lane counts are the plan's, not the Makefile's: a narrowed
  # table has R regular rows of one lane each, and the shard target has to cut
  # its row numbers from the same R.
  gate-shards:
    needs: gate-plan
    if: needs.gate-plan.outputs.run != '0' && needs.gate-plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    # The hosted runner has a docker daemon, so the real docker section must run
    # here: a missing daemon is a failure, not a skip.
    env:
      CC_GATE_REQUIRE_DOCKER: '1'
    # The runners and the extra rows come from the plan job: a static list could
    # not grow by the E extra rows a change to sections opens.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.gate-plan.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gate-plan
          path: ${{ runner.temp }}/plan

      - name: Run shard ${{ matrix.shard }}
        run: make gate-shard SHARD=${{ matrix.shard }} GATE_SHARDS=${{ needs.gate-plan.outputs.runners }} GATE_LANES=${{ needs.gate-plan.outputs.lanes }} GATE_EXTRA=${{ needs.gate-plan.outputs.extra }} GATE_TABLE="$RUNNER_TEMP/plan/table.tsv" GATE_OUT_DIR="$RUNNER_TEMP/out"

      # What the row's traced cut and its solos recorded, for `gate-isolation`.
      # A row without isolation work writes no `iso-<row>` directory.
      - name: Upload the isolation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/iso-*/
          if-no-files-found: ignore

      - name: Upload the section markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-timing-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/timing-*.tsv
          if-no-files-found: ignore

      - name: Upload the lane results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-result-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/out/result-*.tsv
          if-no-files-found: ignore

  # NOT CHAINED BEHIND THE SHARDS AND NOT CHAINED BEHIND THE RATCHET. This is
  # the job that proves no section fell out of the partition, so it has to have
  # its own verdict even on a run where every shard is red. It is chained
  # behind the plan only, and checks the very table the shards ran. A narrowed
  # table is held to the selected list rather than to the whole suite.
  shard-coverage:
    needs: gate-plan
    if: needs.gate-plan.outputs.run != '0' && needs.gate-plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gate-plan
          path: ${{ runner.temp }}/plan

      # The matrix is the plan job's row list and the table is the plan job's
      # cut. They are two outputs, so they are compared here — a list that
      # drifted short would leave the missing row's sections owned by nobody
      # while every job still passed.
      #
      # THE VALUES ARE COMPARED, NOT THE LENGTH. A duplicate entry keeps the
      # length right and produces exactly the outcome the length check exists to
      # catch: `[1 2 3 4 5 6 7 7]` runs shard 7 twice, never runs shard 8, and
      # every job is green. The union check does not see it either — it asks the
      # partitioner whether the shards cover the list, not whether the matrix
      # asked for all of them. One sorted comparison closes short, long,
      # duplicated and out-of-range together.
      #
      # A whole run's R is the Makefile's slot count; a narrowed run's lies in
      # 1..GATE_SHARDS. Either way R is checked here against the Makefile, not
      # only taken from the plan.
      - name: Matrix rows are the runners and the extra rows of the table
        env:
          ROWS: ${{ needs.gate-plan.outputs.rows }}
          EXTRA: ${{ needs.gate-plan.outputs.extra }}
          REGULAR: ${{ needs.gate-plan.outputs.regular }}
          RUNNERS: ${{ needs.gate-plan.outputs.runners }}
          MODE: ${{ needs.gate-plan.outputs.mode }}
        run: |
          n=$(make -s print-gate-shards); s=$(make -s print-gate-slots)
          if [ "$MODE" = "전량" ]; then
            if [ "$REGULAR" != "$s" ] || [ "$RUNNERS" != "$n" ]; then
              echo "전량 판정의 정규 행 $REGULAR · 러너 $RUNNERS 가 Makefile 의 $s · $n 과 다릅니다" >&2
              exit 1
            fi
          elif [ "$REGULAR" -lt 1 ] || [ "$REGULAR" -gt "$n" ] || [ "$RUNNERS" != "$REGULAR" ]; then
            echo "좁힌 판정의 정규 행 $REGULAR · 러너 $RUNNERS 가 1..$n 의 한 레인 행이 아닙니다" >&2
            exit 1
          fi
          got=$(printf '%s' "$ROWS" | jq -r '.[]' | sort -n | tr '\n' ' ')
          expect=$( { seq 1 "$RUNNERS"; if [ "$EXTRA" -gt 0 ]; then seq $(( REGULAR + 1 )) $(( REGULAR + EXTRA )); fi; } | tr '\n' ' ')
          if [ "$got" != "$expect" ]; then
            echo "matrix 의 행 번호 [$got] 가 러너 1..$RUNNERS 과 추가 행 $EXTRA 개 [$expect] 와 다릅니다" >&2
            exit 1
          fi
          t=$(grep -c . "$RUNNER_TEMP/plan/table.tsv")
          if [ "$t" != "$(( REGULAR + EXTRA ))" ]; then
            echo "표의 행 수 $t 가 정규 행 $REGULAR 개와 추가 행 $EXTRA 개의 합과 다릅니다" >&2
            exit 1
          fi
          echo "판정 $MODE · 러너 $RUNNERS 개 · 정규 행 $REGULAR 개 · 추가 행 $EXTRA 개"

      # The table has R + E rows, not N: the check counts the rows the plan job
      # cut and that their ids are exactly 1..R+E. Only the third column is
      # counted, since a laid-over section sits in several rows by design. A
      # narrowed table's union is compared with the selected list instead of
      # the whole one.
      - name: Union of the rows is the whole section list
        env:
          MODE: ${{ needs.gate-plan.outputs.mode }}
          SELECTED: ${{ needs.gate-plan.outputs.selected }}
        run: |
          if [ "$MODE" = "선택" ]; then set -- --only "$SELECTED"; else set --; fi
          bash scripts/gate-shard.sh --shards "${{ needs.gate-plan.outputs.regular }}" --check --from-table "$RUNNER_TEMP/plan/table.tsv" --extra "${{ needs.gate-plan.outputs.extra }}" "$@"

  # Runs whatever the shards did, so a red run still uploads what it measured.
  # The increment check is skipped when a shard failed: its time was cut short,
  # and the run is red already. A run that selected no section has nothing to
  # report beyond saying so, and passes. Only a whole master run uploads the
  # timing and the duration window the next runs read, and only a whole run's
  # sum is judged.
  gate-report:
    needs: [gate-plan, gate-shards]
    if: always() && needs.gate-plan.outputs.run != '0'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      COUNT: ${{ needs.gate-plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gate-plan
          path: ${{ runner.temp }}/plan

      # A run whose shards all died before uploading leaves nothing to match;
      # the merge then keeps the source's values, which is the right answer.
      - uses: actions/download-artifact@v4
        if: needs.gate-plan.outputs.count != '0'
        continue-on-error: true
        with:
          pattern: gate-timing-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.gate-plan.outputs.count != '0'
        continue-on-error: true
        with:
          pattern: gate-result-shard-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Merge the measured times
        if: needs.gate-plan.outputs.count != '0'
        run: |
          make -s print-gate-sections > "$RUNNER_TEMP/list"
          mkdir -p "$RUNNER_TEMP/timing"
          if [ -f "$RUNNER_TEMP/plan/gate-timing.tsv" ]; then
            set -- --source "$RUNNER_TEMP/plan/gate-timing.tsv"
          else
            set --
          fi
          bash scripts/gate-timing.sh merge --list "$RUNNER_TEMP/list" --run "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" "$@" \
            --out "$RUNNER_TEMP/timing/gate-timing.tsv" "$RUNNER_TEMP"/shards/timing-*.tsv

      - name: Upload the timing for the next runs
        if: needs.gate-plan.outputs.count != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: gate-timing
          path: ${{ runner.temp }}/timing/gate-timing.tsv

      - name: Upload the timing candidate
        if: needs.gate-plan.outputs.count != '0' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gate-timing-candidate
          path: ${{ runner.temp }}/timing/gate-timing.tsv

      - name: Report the shard times
        id: report
        if: needs.gate-plan.outputs.count != '0'
        run: |
          bash scripts/gate-timing.sh report --table "$RUNNER_TEMP/plan/table.tsv" --dir "$RUNNER_TEMP/shards" | tee "$RUNNER_TEMP/report.out"
          echo "sum=$(tail -n 1 "$RUNNER_TEMP/report.out")" >> "$GITHUB_OUTPUT"

      - name: Duration signal
        if: needs.gate-plan.outputs.count != '0' && needs.gate-plan.outputs.mode == '전량' && needs.gate-shards.result == 'success'
        run: bash scripts/ci-duration.sh check --key gate --seconds "${{ steps.report.outputs.sum }}" --window-out "$RUNNER_TEMP/ci-duration-gate" --plan-dir "$RUNNER_TEMP/plan" --sections "$RUNNER_TEMP/timing/gate-timing.tsv"

      - name: Duration signal skipped
        if: needs.gate-plan.outputs.count != '0' && needs.gate-plan.outputs.mode == '전량' && needs.gate-shards.result != 'success'
        run: echo "::notice::gate 샤드가 성공하지 않아(${{ needs.gate-shards.result }}) 소요 증분 판정을 건너뜁니다 — 잘린 소요로는 판정하지 않습니다"

      # A narrowed verdict says so instead of judging its sum: the sum of a few
      # sections is not comparable with the whole-suite window. A verdict of
      # no section has run no shard and says that.
      - name: Summarize the verdict
        if: always() && needs.gate-plan.outputs.mode != '전량'
        run: |
          if [ "$COUNT" = "0" ]; then
            line="선택 0절 — 이 변경이 닿는 gate 절이 없어 샤드를 띄우지 않았습니다"
          else
            line="좁힌 실행 — 합 비교 생략 (선택 ${COUNT}절, 행 합 ${{ steps.report.outputs.sum }}초)"
          fi
          echo "gate-report: $line"
          {
            echo "### gate 보고"
            echo ""
            echo "- $line"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the duration window
        if: needs.gate-plan.outputs.count != '0' && needs.gate-plan.outputs.mode == '전량' && needs.gate-shards.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ci-duration-gate
          path: ${{ runner.temp }}/ci-duration-gate/

      # What a pull request actually waited, measured last so it covers the
      # whole attempt. The artifact carries the attempt number, so a re-run
      # attempt leaves its own line beside the first one. It never fails the
      # job: past 900 s raw it warns.
      #
      # The extra rows are rows and runners too, so both counts take E. The
      # regular rows, runners and lanes are the plan's, which a narrowed run
      # cut smaller than the Makefile's.
      - name: Wall clock
        if: always() && needs.gate-plan.outputs.count != '0'
        env:
          REGULAR: ${{ needs.gate-plan.outputs.regular }}
          RUNNERS: ${{ needs.gate-plan.outputs.runners }}
          LANES: ${{ needs.gate-plan.outputs.lanes }}
          EXTRA: ${{ needs.gate-plan.outputs.extra }}
        run: |
          e=${EXTRA:-0}
          bash scripts/ci-duration.sh wall --slots "$(( REGULAR + e ))" --runners "$(( RUNNERS + e ))" --lanes "$LANES" --timing-dir "$RUNNER_TEMP/shards" --result-dir "$RUNNER_TEMP/results" --out "$RUNNER_TEMP/wall/gate-wall.txt"

      - name: Upload the wall clock
        if: always() && needs.gate-plan.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: gate-wall-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wall/gate-wall.txt
          if-no-files-found: ignore

      # A row that ran is a row that printed its total. Every non-empty row of
      # the table must have one, and no other row may — a runner that never
      # started a lane, or a lane that died before its tail, shows up here by
      # row id even when the matrix job's own verdict was lost. An extra row has
      # no regular cut and answers with `격리 전용 행` instead. It is last so a
      # red verdict here never skips the uploads above.
      - name: Every row printed its total
        if: always() && needs.gate-plan.outputs.count != '0'
        env:
          REGULAR: ${{ needs.gate-plan.outputs.regular }}
          EXTRA: ${{ needs.gate-plan.outputs.extra }}
        run: |
          bash scripts/gate-timing.sh rows --table "$RUNNER_TEMP/plan/table.tsv" --dir "$RUNNER_TEMP/results" --slots "$(( REGULAR + ${EXTRA:-0} ))"

  # THE VERDICT ON THE CHANGED SECTIONS. It waits for the shards but runs
  # whatever they did, since a red row still uploaded what it recorded, and it
  # runs beside `gate-report` in seconds, so it adds nothing to the wall clock.
  # A row the plan put isolation work on that sent nothing back is a failure:
  # an empty input must never read as "the same". With no such row there is
  # nothing to receive, and the job passes on an empty result without asking
  # how a download of no artifact ends.
  gate-isolation:
    needs: [gate-plan, gate-shards]
    if: always() && needs.gate-plan.result == 'success' && needs.gate-plan.outputs.run != '0'
    runs-on: ubuntu-24.04
    env:
      WORK: ${{ needs.gate-plan.outputs.work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gate-plan
          path: ${{ runner.temp }}/plan

      - uses: actions/download-artifact@v4
        if: needs.gate-plan.outputs.work != '0'
        continue-on-error: true
        with:
          pattern: iso-*
          path: ${{ runner.temp }}/iso
          merge-multiple: true

      - name: Every changed section behaves the same in every context
        run: |
          mkdir -p "$RUNNER_TEMP/iso" "$RUNNER_TEMP/isolation"
          if [ "$WORK" = "0" ]; then
            : > "$RUNNER_TEMP/isolation/result.tsv"
            echo "격리 작업을 실은 행이 없습니다 — 빈 결과 표로 통과합니다"
            exit 0
          fi
          rc=0
          bash scripts/gate-isolation.sh compare --dir "$RUNNER_TEMP/iso" --plan "$RUNNER_TEMP/plan/table.tsv" \
            --out "$RUNNER_TEMP/isolation/result.tsv" 2> "$RUNNER_TEMP/isolation/compare.err" || rc=$?
          cat "$RUNNER_TEMP/isolation/compare.err" >&2
          {
            echo "### gate 격리 검사"
            echo ""
            sed 's/^gate-isolation: /- /' "$RUNNER_TEMP/isolation/compare.err"
            echo ""
            echo "| 절 | 상태 | 맥락 | 첫 차이 |"
            echo "| --- | --- | --- | --- |"
            [ ! -f "$RUNNER_TEMP/isolation/result.tsv" ] \
              || awk -F '\t' '{ gsub(/\|/, "\\|"); print "| " $1 " | " $2 " | " $3 " | " $4 " |" }' "$RUNNER_TEMP/isolation/result.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload the isolation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-isolation
          path: ${{ runner.temp }}/isolation/
          if-no-files-found: ignore

  # THE ONE WAY A MASTER REGRESSION REACHES A PERSON. A whole master run that
  # fails writes into the open `gate-full-failure` issue, or opens it; the next
  # whole success closes it. It runs on every scheduled or manual master round,
  # whatever the jobs before it ended in and whatever `run` says: a skipped
  # round (`run` 0) only looks for a gap — a last whole success older than
  # three intervals with merges after it — and never closes the issue. Only on
  # master: a `workflow_dispatch` from a branch never opens or closes master's
  # issue. The full history is fetched because the candidates are the
  # first-parent merges since the last whole success and their first parents,
  # and yq is installed because the selector run on each merge needs it — a
  # selector that cannot decide reads as the whole suite and makes every merge
  # a candidate. Naming one permission at job level sets every unnamed one to
  # `none`, so all three are written.
  gate-full-report:
    needs: [gate-plan, gate-shards, shard-coverage, gate-report, gate-isolation]
    if: always() && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mikefarah/yq@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gate-plan
          path: ${{ runner.temp }}/plan

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gate-result-shard-*
          path: ${{ runner.temp }}/results
          merge-multiple: true

      - name: Write the failure issue or close it
        run: |
          bash scripts/gate-full.sh report \
            --run "${{ needs.gate-plan.outputs.run }}" \
            --plan "${{ needs.gate-plan.result }}" \
            --shards "${{ needs.gate-shards.result }}" \
            --coverage "${{ needs.shard-coverage.result }}" \
            --report "${{ needs.gate-report.result }}" \
            --plan-dir "$RUNNER_TEMP/plan" --results-dir "$RUNNER_TEMP/results"
