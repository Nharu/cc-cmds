name: lint

on:
  pull_request:
    paths:
      - 'plugins/cc-cmds/skills/**'
      - 'plugins/cc-cmds/orchestrator/**'
      - 'plugins/cc-cmds/hooks/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'README.md'
      - 'Makefile'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - master

jobs:
  lint-and-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mikefarah/yq
        uses: mikefarah/yq@v4

      - name: Lint Control-Flow Invariants placement
        run: make lint

      - name: Verify README is up to date
        run: |
          make readme
          if ! git diff --exit-code README.md; then
            echo "README.md is stale — run 'make readme' locally and commit the result." >&2
            exit 1
          fi

      # The rest-tests matrix spells its shard numbers out and the Makefile holds
      # the count, so they are compared here, by VALUE: a duplicate entry keeps the
      # length right while one shard runs twice and another never. This job, not
      # the test shards, carries the verdict, so it stands even when every shard
      # is red.
      - name: Rest matrix shard numbers are exactly 1..REST_SHARDS
        run: |
          want=$(make -s print-rest-shards)
          got=$(yq '.jobs.rest-tests.strategy.matrix.shard[]' .github/workflows/lint.yml | sort -n | tr '\n' ' ')
          expect=$(seq 1 "$want" | tr '\n' ' ')
          if [ "$got" != "$expect" ]; then
            echo "rest-tests matrix 의 샤드 번호 [$got] 가 1..$want [$expect] 와 다릅니다" >&2
            exit 1
          fi
          echo "rest 샤드 $want 개"

      - name: Union of the rest shards is the whole test-rest goal list
        run: bash scripts/rest-shard.sh --shards "$(make -s print-rest-shards)" --check

  # THE GATE SUITE IS NOT HERE. It runs sharded in `gate.yml`, and running it in
  # both places would put back the three serial hours the sharding removes. What is
  # left is everything else `make test` covers.
  #
  # CUT INTO RUNNERS BY RECORDED DURATION. scripts/rest-shard.sh deals the
  # `test-rest` goals onto REST_SHARDS runners by the seconds in
  # scripts/rest-census.tsv, and each runner starts its longest suite first, so
  # the job's wall clock comes down to its longest suite rather than the sum.
  # -j is what lets a runner's suites run at once; without it make still walks
  # them one at a time. `fail-fast: false` so a red shard does not cancel the
  # others and hide whether one suite or several broke.
  #
  # Every suite's end line (rc and seconds) is in the log, and each runner's
  # durations are printed longest first and uploaded as rest-timing-<shard>, the
  # input `scripts/rest-shard.sh --merge` rebuilds the census from.
  rest-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Install mikefarah/yq
        uses: mikefarah/yq@v4

      # The click handler's real-server suite fails under CI without tmux. The
      # visual capture suite serves a loopback page with python3 and checks the
      # port is closed with lsof; it fails rather than skips without either.
      - name: Install tmux, python3 and lsof
        run: sudo apt-get update && sudo apt-get install -y tmux python3 lsof

      - name: Run rest shard ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/rest-timing"
          CC_SUITE_TIMING_DIR="$RUNNER_TEMP/rest-timing" make -j"$(nproc)" rest-shard SHARD=${{ matrix.shard }}

      - name: Suite durations, longest first
        if: always()
        run: |
          printf '초\trc\t스위트\n'
          cat "$RUNNER_TEMP"/rest-timing/suite.* 2>/dev/null \
            | awk -F '\t' 'NF >= 3 { printf "%s\t%s\t%s\n", $2, $3, $1 }' | sort -t "$(printf '\t')" -k1,1nr

      - name: Upload suite durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-timing-${{ matrix.shard }}
          path: ${{ runner.temp }}/rest-timing/
          if-no-files-found: warn
