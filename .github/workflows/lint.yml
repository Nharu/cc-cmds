name: lint

on:
  pull_request:
    paths:
      - 'plugins/cc-cmds/skills/**'
      - 'plugins/cc-cmds/orchestrator/**'
      - 'plugins/cc-cmds/hooks/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'README.md'
      - 'Makefile'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - master

# Naming one permission sets every unnamed one to `none`, so both are written:
# `contents` for the checkout and `actions` for the duration signal to read the
# master runs' baseline artifacts.
permissions:
  contents: read
  actions: read

jobs:
  lint-and-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mikefarah/yq
        uses: mikefarah/yq@v4

      - name: Lint Control-Flow Invariants placement
        run: make lint

      - name: Verify README is up to date
        run: |
          make readme
          if ! git diff --exit-code README.md; then
            echo "README.md is stale — run 'make readme' locally and commit the result." >&2
            exit 1
          fi

  # THE GATE SUITE IS NOT HERE. It runs sharded in `gate.yml`, and running it in
  # both places would put back the three serial hours the sharding removes. What is
  # left is everything else `make test` covers, which is minutes rather than an
  # hour.
  #
  # -j is what makes the suite's list-of-prerequisites form pay off; without it
  # make still walks the scripts one at a time.
  rest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mikefarah/yq
        uses: mikefarah/yq@v4

      # The click handler's real-server suite fails under CI without tmux. The
      # visual capture suite serves a loopback page with python3 and checks the
      # port is closed with lsof; it fails rather than skips without either.
      - name: Install tmux, python3 and lsof
        run: sudo apt-get update && sudo apt-get install -y tmux python3 lsof

      # The duration signal measures this one step: checkout and package
      # installs are not what a pull request changes, and they only add noise.
      - name: Record the test start
        run: echo "CC_TEST_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run tests except the gate suite
        run: make -j"$(nproc)" test-rest

      # The token is given to this step alone, not to the workflow: the suites
      # above must keep running without a credential they could reach out with.
      - name: Duration signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-duration.sh check --key lint-rest-tests --seconds "$(( $(date +%s) - CC_TEST_T0 ))" --window-out "$RUNNER_TEMP/ci-duration-lint-rest-tests"

      - name: Upload the duration window
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: ci-duration-lint-rest-tests
          path: ${{ runner.temp }}/ci-duration-lint-rest-tests/
