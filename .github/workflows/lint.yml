name: lint

on:
  pull_request:
    paths:
      - 'plugins/cc-cmds/skills/**'
      - 'plugins/cc-cmds/hooks/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'README.md'
      - 'Makefile'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - master

# One run per ref. A push onto a branch that already has a run in flight cancels
# it: the older run is measuring bytes that no longer exist, and on this repo a
# single run is minutes of wall clock, so leaving both alive doubles the cost to
# report a result nobody will read. `master` is excluded from cancellation —
# there each push is a distinct state whose result is a record, not a preview.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint-and-readme:
    runs-on: ubuntu-latest
    # A hung step otherwise holds a runner for the platform default of six hours.
    # The measured floor is dominated by one lint whose cost is spawn-bound, so
    # the ceiling is set well above the observed runtime rather than tight to it:
    # a timeout that trips on a slow runner is a flaky gate, and a flaky gate is
    # worse than a slow one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install mikefarah/yq
        uses: mikefarah/yq@v4

      - name: Lint Control-Flow Invariants placement
        run: make lint

      - name: Verify README is up to date
        run: |
          make readme
          if ! git diff --exit-code README.md; then
            echo "README.md is stale — run 'make readme' locally and commit the result." >&2
            exit 1
          fi

      - name: Run tests
        run: make test
