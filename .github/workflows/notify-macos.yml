name: notify-macos

on:
  pull_request:
    paths: &notify_macos_paths
      - 'plugins/cc-cmds/orchestrator/**'
      - 'plugins/cc-cmds/skills/active-notify/**'
      - 'plugins/cc-cmds/skills/_common/notify.md'
      - 'plugins/cc-cmds/hooks/active-notify-*.sh'
      - 'plugins/cc-cmds/hooks/session-return-dismiss.sh'
      - 'plugins/cc-cmds/hooks/hooks.json'
      - 'scripts/test-active-notify-*.sh'
      - 'scripts/lint-bash-portability.sh'
      - 'scripts/test-lint-bash-portability.sh'
      # The notifier oracle is the only thing in the tree that measures the
      # notifier's own swallowing set rather than our assumptions about it,
      # and it needs the real binary — so it runs on this leg and nowhere
      # else. A file this filter does not name is a file this job never sees,
      # which would leave the test existing and never once run.
      - 'scripts/test-notify-title-oracle.sh'
      # The banner click handler's accessibility helper is compiled from Swift
      # on first use, and only a darwin host has the compiler and the
      # frameworks it links; its source sits under the orchestrator glob above.
      - 'scripts/test-notify-focus-ax.sh'
      # The chain-equivalence harness runs the frozen reference against the
      # candidate under a UTF-8 locale, which is the configuration the driver
      # deliberately runs in, so its verdict is only meaningful on a leg that
      # has one. The same reasoning as the comment above applies with the
      # divergence reversed: this leg is the one that already had the locale,
      # and the filter is what decides whether it ever looks.
      - 'scripts/test-gate-chain-equiv.sh'
      - 'tests/fixtures/gate-chain-equiv/**'
      # The gate suite's advisory-lock section and the Hangul-date fingerprint
      # assertions check something only on this host, and both suites source
      # the shared fixture library, so the library is named with them.
      - 'scripts/test-gate.sh'
      - 'scripts/test-liveness-agreement.sh'
      - 'scripts/run-fixture.sh'
      # Every suite on this leg runs under the per-suite wrapper, the make step
      # is armed by the sourced step guard, and the wrapper's own suite checks
      # both on the host they were written for. The step guard is sourced from
      # the `run:` block, which the keepset lint does not follow, so this entry
      # is justified by the wrapper suite naming its path rather than by the
      # workflow; dropping it would not be caught by the lint.
      - 'scripts/suite-guard.sh'
      - 'scripts/ci-step-guard.sh'
      - 'scripts/test-suite-guard.sh'
      - 'tests/fixtures/active-notify-lifecycle/**'
      - 'tests/fixtures/active-notify-hooks/**'
      - 'tests/fixtures/lint-bash-portability/**'
      - '.github/workflows/notify-macos.yml'
      - 'Makefile'
  push:
    branches:
      - master
    paths: *notify_macos_paths

jobs:
  lint-and-test-macos:
    runs-on: macos-latest
    # This leg runs only what the ubuntu leg cannot check — the short list in
    # the Makefile's `test-darwin-narrow` target. It no longer runs the whole
    # gate suite, so the old reason for a very long ceiling (that suite slowing
    # down as it runs) no longer applies to this job.
    #
    # The 16-minute ceiling is the outer safety net, not the thing that tells
    # a hang from progress. The make step is armed (scripts/ci-step-guard.sh)
    # with a deadline inside this ceiling — the job start plus CC_JOB_BUDGET_S,
    # less a margin for its dump — and every suite under it has a deadline
    # inside that one, so a stall ends as a named failure with the holders
    # dumped before the runner would cancel the job. The longest successful
    # run so far took about seven minutes. The click helper's suite adds a
    # cold Swift compile — 8 to 26 seconds on an idle developer machine, but
    # 184 seconds was measured under load, so it is budgeted at four minutes —
    # and seven plus four still fits inside sixteen, so the ceiling stays.
    # The return-hook suite took 67 seconds on a developer machine; budgeted
    # at two minutes and counted as if it ran after everything else, seven
    # plus four plus two is thirteen, which still fits, so the ceiling stays.
    # When the list grows, recompute the same way. CC_JOB_BUDGET_S below must
    # equal this ceiling times 60: `timeout-minutes` cannot read `env`, so the
    # two are tied by a check in scripts/test-suite-guard.sh rather than by a
    # reference. Change both together.
    timeout-minutes: 16
    env:
      CC_SUITE_GUARD_STRICT: '1'
      CC_JOB_BUDGET_S: '960'
    steps:
      # First, before checkout: the step deadline is measured from here.
      - name: Record job start
        run: echo "CC_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install yq + terminal-notifier
        # mikefarah/yq@v4 is a Docker container action and is unsupported
        # on macOS runners, so install both yq and terminal-notifier via
        # Homebrew. brew is preinstalled on macos-latest images.
        run: brew install yq terminal-notifier
        timeout-minutes: 3

      - name: yq sanity check
        run: yq --version

      - name: Run darwin-only tests
        # Only the suites whose assertions check something on this host that
        # they do not check on ubuntu. The list, and the reason for each entry,
        # sit beside the target in the Makefile. Everything else — `make lint`
        # included — runs on the ubuntu leg in the `lint` workflow. The first
        # line arms the step before make starts; the make line stays as is.
        run: |
          . scripts/ci-step-guard.sh
          make -j"$(sysctl -n hw.ncpu)" test-darwin-narrow
