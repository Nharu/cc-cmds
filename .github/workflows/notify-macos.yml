name: notify-macos

on:
  pull_request:
    paths: &notify_macos_paths
      - 'plugins/cc-cmds/orchestrator/**'
      - 'plugins/cc-cmds/skills/active-notify/**'
      - 'plugins/cc-cmds/skills/_common/notify.md'
      - 'plugins/cc-cmds/hooks/active-notify-*.sh'
      - 'plugins/cc-cmds/hooks/hooks.json'
      - 'scripts/test-active-notify-*.sh'
      - 'scripts/lint-bash-portability.sh'
      - 'scripts/test-lint-bash-portability.sh'
      # The banner-rendering layer. The oracle below is the only thing in the
      # tree that measures the notifier's own swallowing set rather than our
      # assumptions about it, and it needs the real binary — so it runs on this
      # leg and nowhere else. A file this filter does not name is a file this
      # job never sees, which would leave the test existing and never once run.
      - 'scripts/test-notify-title-oracle.sh'
      - 'scripts/lint-notify-title-render.sh'
      - 'scripts/test-lint-notify-title-render.sh'
      - 'scripts/lint-notify-fire-sites.sh'
      - 'scripts/test-lint-notify-fire-sites.sh'
      # The chain-equivalence harness runs the frozen reference against the
      # candidate under a UTF-8 locale, which is the configuration the driver
      # deliberately runs in, so its verdict is only meaningful on a leg that
      # has one. The same reasoning as the comment above applies with the
      # divergence reversed: this leg is the one that already had the locale,
      # and the filter is what decides whether it ever looks.
      - 'scripts/test-gate-chain-equiv.sh'
      - 'tests/fixtures/gate-chain-equiv/**'
      - 'scripts/measure-gate-cost.sh'
      - 'scripts/test-measure-gate-cost.sh'
      - 'tests/fixtures/active-notify-lifecycle/**'
      - 'tests/fixtures/active-notify-hooks/**'
      - 'tests/fixtures/lint-bash-portability/**'
      - 'tests/fixtures/lint-notify-title-render/**'
      - 'tests/fixtures/lint-notify-fire-sites/**'
      - '.github/workflows/notify-macos.yml'
      - 'Makefile'
  push:
    branches:
      - master
    paths: *notify_macos_paths

jobs:
  lint-and-test-macos:
    runs-on: macos-latest
    # `make lint` alone has been taking 7-8.5 minutes on this runner against the
    # old 10-minute ceiling — 70-85% of the budget spent before the tests start,
    # so ordinary runner variance cancelled the job with every step reporting
    # success. One lint dominates: lint-bash-portability is 206s of the 242s the
    # whole suite takes locally. Raising the ceiling stops a green run from
    # reading as a failure; making that lint cheaper is separate work and is not
    # what this number is standing in for.
    # The ceiling is now 150, and the number was raised four times to get there.
    # The history is kept because each step measured something the next one
    # needed.
    #
    # At 25 the job was cancelled at 25m19s with lint green at 12m41s and the
    # darwin tests cut off at 12m25s — neither half had failed, the budget was
    # simply sized for a smaller tree. Raised to 45.
    #
    # At 45 it was cancelled again. The final passing assertions were 10-17
    # seconds APART and the job died 73 seconds after one of them, still making
    # progress and never hung; the same suite had finished at 31m32s one commit
    # earlier, which is how little headroom 45 actually was.
    #
    # Master hit the same wall independently at 25, and that reading is the
    # sharpest of the three: the run one commit before passed at 24m58s — twenty
    # two seconds inside the ceiling — and adding a handful of assertions pushed
    # the next one to a cancellation at 25m22s. A budget with twenty-two seconds
    # of margin is not a budget.
    #
    # At 90 it was cancelled a fourth time, and this reading finally says where
    # the wall clock goes. The test step is ONE SCRIPT: `make -j` starts 16
    # suites and 15 of them are done inside the first three minutes, after which
    # `scripts/test-gate.sh` runs ALONE for 76 of that step's 79 minutes. The
    # parallelism is already saturated, so the ceiling is that one script's
    # serial time and nothing else. The twenty-three lint scripts are NOT part
    # of this count — they belong to the separate lint step, and counting the
    # two steps together is how the first version of this paragraph arrived at
    # a suite count of 39.
    #
    # THE EARLIER EXPLANATION ON THIS BLOCK WAS WRONG and is corrected rather
    # than deleted, because it named a mechanism a reader would otherwise go on
    # optimizing. It said the suite gets slower as it runs because each gate
    # call re-reads a growing ledger. The chain walk is flat — about 10ms over
    # 91 rows against about 14ms over 2849, because it walks the whole ledger in
    # one process — and the assertion rate does not decay. Bucketed on
    # five-minute boundaries across the stretch where the script runs alone, it
    # is 118/180/205 over the first fifteen minutes, 8 to 50 over the next
    # forty-five, and 212/177 over the last ten. The end is as fast as the
    # start, which a ledger-size cost cannot produce.
    #
    # What is expensive is a BAND of sections rather than a trend: those middle
    # forty-five minutes carry about 260 assertions, in the area where every
    # assertion opens and closes a real approval through the gate. Per-assertion
    # cost varies more than tenfold across the run, so what these numbers settle
    # is that the cost is NOT superlinear in ledger size — they do not make the
    # total linear in assertion count either.
    #
    # 150 is chosen against a COMPLETED run of 79m54s for this step, 82m05s for
    # the job. The 90 ceiling was hit at 86m30s, and that figure is a
    # cancellation point rather than a duration — that run never finished, so
    # its true cost is unknown and larger than 86m30s. Splitting the script so
    # `-j` can reach it is the real fix and is filed separately.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install yq + terminal-notifier
        # mikefarah/yq@v4 is a Docker container action and is unsupported
        # on macOS runners, so install both yq and terminal-notifier via
        # Homebrew. brew is preinstalled on macos-latest images.
        run: brew install yq terminal-notifier
        timeout-minutes: 3

      - name: yq sanity check
        run: yq --version

      - name: Run lint
        run: make lint

      - name: Run darwin-only tests
        # The orchestrator's darwin-only claims live here and NOWHERE else:
        # reparenting under `set -m`, contention on the advisory lock, and the
        # boot clock across a sleep. Everything else about the driver is
        # seam-driven and is covered by the ubuntu leg through injection.
        run: make -j"$(sysctl -n hw.ncpu)" test-darwin
