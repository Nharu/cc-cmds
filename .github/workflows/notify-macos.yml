name: notify-macos

on:
  pull_request:
    paths: &notify_macos_paths
      - 'plugins/cc-cmds/skills/active-notify/**'
      - 'plugins/cc-cmds/skills/_common/notify.md'
      - 'plugins/cc-cmds/hooks/active-notify-*.sh'
      - 'plugins/cc-cmds/hooks/hooks.json'
      - 'scripts/test-active-notify-*.sh'
      - 'scripts/lint-active-notify-*.sh'
      # The two drivers this job actually runs, named rather than globbed. The
      # glob also selected the mutation harnesses, which no step here invokes —
      # a path filter that wakes a job for a file the job never reads spends CI
      # and teaches the next reader that the job covers something it does not.
      - 'scripts/test-lint-active-notify-drift.sh'
      - 'scripts/test-lint-active-notify-subcommands.sh'
      - 'tests/fixtures/lint-active-notify-drift/**'
      - 'tests/fixtures/lint-active-notify-subcommands/**'
      - 'scripts/lint-bash-portability.sh'
      - 'scripts/test-lint-bash-portability.sh'
      - 'tests/fixtures/active-notify-lifecycle/**'
      - 'tests/fixtures/active-notify-hooks/**'
      - 'tests/fixtures/lint-bash-portability/**'
      - '.github/workflows/notify-macos.yml'
      - 'Makefile'
  push:
    branches:
      - master
    paths: *notify_macos_paths

jobs:
  lint-and-test-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install yq + terminal-notifier
        # mikefarah/yq@v4 is a Docker container action and is unsupported
        # on macOS runners, so install both yq and terminal-notifier via
        # Homebrew. brew is preinstalled on macos-latest images.
        run: brew install yq terminal-notifier
        timeout-minutes: 3

      - name: yq sanity check
        run: yq --version

      - name: Run lint
        run: make lint

      - name: Run active-notify tests
        run: make test-active-notify

      - name: Run active-notify lint drivers
        # These two drivers are the only exercise the lints' grep and awk
        # recognizers get on BSD. `make lint` runs the lints against the real
        # tree, which by construction never takes the recognizer paths the
        # fixtures exist to take.
        run: |
          bash scripts/test-lint-active-notify-drift.sh
          bash scripts/test-lint-active-notify-subcommands.sh
