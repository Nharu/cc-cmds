name: lint

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'Makefile'
      - '.github/workflows/lint.yml'
      - '.github/workflows/notify-macos.yml'
  push:
    branches:
      - master

jobs:
  lint-and-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: make lint
