name: notify-macos

# The only `make` holder is a job whose matrix product is annihilated by
# `exclude`, so it never runs and the whole execution set is derived from it.
# This is the shape that measured md5-identical to the healthy tree, and it is
# the one no tool objects to: actionlint reports zero diagnostics here.
on:
  pull_request:
    paths: &notify_macos_paths
      - 'scripts/suite-a.sh'
      - 'Makefile'
      - '.github/workflows/notify-macos.yml'
  push:
    branches:
      - master
    paths: *notify_macos_paths

jobs:
  test-macos-native:
    runs-on: macos-latest
    env:
      CC_CMDS_REQUIRE_NATIVE: '1'
      CC_CMDS_NOTIFY_ORACLE_REQUIRED: '1'
    timeout-minutes: 8
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        exclude:
          - os: ubuntu-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run darwin-only tests
        run: make test-darwin
