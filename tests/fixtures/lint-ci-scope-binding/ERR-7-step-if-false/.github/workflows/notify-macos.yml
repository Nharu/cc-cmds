name: notify-macos

on:
  pull_request:
    paths: &notify_macos_paths
      - 'scripts/suite-a.sh'
      - 'scripts/suite-b.sh'
      - 'Makefile'
      - '.github/workflows/notify-macos.yml'
  push:
    branches:
      - master
    paths: *notify_macos_paths

jobs:
  test-macos-native:
    runs-on: macos-latest
    env:
      CC_CMDS_REQUIRE_NATIVE: '1'
      CC_CMDS_NOTIFY_ORACLE_REQUIRED: '1'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run darwin-only tests
        run: make test-darwin
      - name: A make step the workflow turned off
        if: false
        run: make extra
